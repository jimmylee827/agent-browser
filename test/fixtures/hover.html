<!doctype html><meta charset="utf-8"><title>Hover</title>
<style>
  .card { display: block; position: relative; width: 240px; height: 240px; margin: 20px; }
  .card .front, .card .back { position: absolute; inset: 0; }
  .card .front { background: rgb(0, 0, 255); }
  .card .back { background: rgb(255, 0, 0); opacity: 0; }
  .card:hover .back { opacity: 1; }
</style>
<a class="card" href="#jacket" aria-label="Pilot jacket"><span class="front"></span><span class="back"></span></a>
<a class="plain" href="#plain" style="display:block;margin:20px;color:black;text-decoration:none">Plain link with no hover style</a>
