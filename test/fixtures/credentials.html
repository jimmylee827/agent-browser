<!doctype html><meta charset="utf-8"><title>Login</title>
<form onsubmit="event.preventDefault(); if (window.PasswordCredential) navigator.credentials.store(new PasswordCredential({id: document.getElementById('user').value, password: document.getElementById('pw').value})); document.getElementById('out').textContent='signed in';">
  <label>User <input id="user" autocomplete="username"></label>
  <label>Password <input id="pw" type="password" autocomplete="current-password"></label>
  <button>Sign in</button>
</form>
<p id="out"></p>
